<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
>

<meta name="theme-color" content="#061a3a">

<title>Temple Tour | Srirangam</title>

<style>

/* =========================================================
   ROOT
========================================================= */

:root {
    --blue: #0755b8;
    --deep-blue: #04152d;
    --gold: #d8b15a;
    --gold-light: #f5dda2;
    --white: #ffffff;
    --black: #000000;
    --glass: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.22);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--deep-blue);
}

body {
    font-family:
        Arial,
        "Noto Sans Tamil",
        "Noto Sans Telugu",
        "Noto Sans Malayalam",
        "Noto Sans Kannada",
        "Noto Sans Devanagari",
        sans-serif;

    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}


/* =========================================================
   APPLICATION
========================================================= */

#app {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    overflow: hidden;
    background: var(--deep-blue);
}

.screen {
    position: absolute;
    inset: 0;

    display: none;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

.screen.active {
    display: flex;
}

.hidden {
    display: none !important;
}


/* =========================================================
   LOADER
========================================================= */

#loaderScreen {
    justify-content: center;
    align-items: center;
    background: var(--blue);
}

.loader {
    width: 68px;
    height: 68px;

    border-radius: 50%;

    border: 5px solid rgba(255,255,255,.25);
    border-top-color: white;

    animation: rotate .8s linear infinite;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   GENERIC MEDIA BACKGROUND
========================================================= */

.media-background {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

.media-background video,
.media-background img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.dark-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.20),
            rgba(0,0,0,.42),
            rgba(0,0,0,.88)
        );
}


/* =========================================================
   WELCOME SCREEN
========================================================= */

#welcomeScreen {
    justify-content: center;
    align-items: flex-end;

    color: white;
}

.welcome-content {
    position: relative;
    z-index: 10;

    width: min(100%, 850px);

    text-align: center;

    padding:
        30px
        24px
        calc(125px + env(safe-area-inset-bottom));
}

.temple-tamil {
    font-size: clamp(24px, 7vw, 50px);
    line-height: 1.4;
    font-weight: 700;

    text-shadow:
        0 4px 18px rgba(0,0,0,.85);
}

.temple-english {
    margin-top: 15px;

    font-size: clamp(17px, 4.8vw, 29px);
    line-height: 1.45;

    color: var(--gold-light);

    text-shadow:
        0 3px 12px rgba(0,0,0,.85);
}

.temple-code {
    display: inline-flex;

    margin: 18px 0 28px;

    padding: 8px 18px;

    border: 1px solid var(--gold);

    border-radius: 50px;

    color: var(--gold-light);

    letter-spacing: 2px;
}

.primary-button {
    min-height: 58px;

    padding: 15px 35px;

    border: 1px solid var(--gold);

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #b8882f,
            #f0d17f
        );

    color: #1d1305;

    font-size: 16px;
    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;
}


/* =========================================================
   PROPER FOOTER
========================================================= */

.app-footer {
    position: absolute;

    left: 0;
    right: 0;

    bottom:
        calc(
            14px +
            env(safe-area-inset-bottom)
        );

    z-index: 50;

    width: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    pointer-events: none;

    padding: 0 20px;
}

.powered-by-text {
    color: rgba(255,255,255,.88);

    font-size: clamp(10px, 3vw, 13px);

    line-height: 1.45;

    letter-spacing: .2px;

    text-align: center;
}

.powered-by-text strong {
    display: block;

    color: white;

    font-size: clamp(12px, 3.4vw, 15px);

    font-weight: 700;

    margin-top: 1px;
}

.footer-logo {
    display: block;

    width: 76px;
    height: 32px;

    margin: 6px auto 0;

    object-fit: contain;
}


/* =========================================================
   LANGUAGE SCREEN
========================================================= */

#languageScreen {
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at top,
            #165da7,
            #06152e 65%
        );

    color: white;
}

.language-wrap {
    width: min(92%, 900px);

    max-height: 92dvh;

    overflow-y: auto;

    text-align: center;

    padding:
        30px 0
        50px;
}

.language-wrap h1 {
    font-size:
        clamp(29px, 8vw, 52px);

    color: var(--gold-light);
}

.language-wrap p {
    margin: 14px 0 30px;

    opacity: .85;
}

.language-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 14px;
}

.language-button {
    min-height: 88px;

    padding: 10px;

    border:
        1px solid
        var(--glass-border);

    border-radius: 16px;

    background:
        rgba(255,255,255,.08);

    color: white;

    cursor: pointer;

    backdrop-filter:
        blur(10px);
}

.language-native {
    display: block;

    font-size:
        clamp(16px, 5vw, 22px);

    font-weight: 700;
}

.language-english {
    display: block;

    margin-top: 8px;

    font-size: 12px;

    opacity: .7;
}


/* =========================================================
   INTRO VIDEO SCREEN
========================================================= */

#introScreen {
    background: black;
}

#introVideo {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: black;
}


/* =========================================================
   TOP ICON BUTTONS
========================================================= */

.icon-button {
    position: absolute;

    z-index: 200;

    width: 52px;
    height: 52px;

    display: flex;

    justify-content: center;
    align-items: center;

    border:
        1px solid
        rgba(255,255,255,.30);

    border-radius: 50%;

    background:
        rgba(0,0,0,.48);

    color: white;

    cursor: pointer;

    backdrop-filter:
        blur(10px);
}

.top-left {
    left:
        max(
            16px,
            env(safe-area-inset-left)
        );

    top:
        max(
            16px,
            env(safe-area-inset-top)
        );
}

.top-right {
    right:
        max(
            16px,
            env(safe-area-inset-right)
        );

    top:
        max(
            16px,
            env(safe-area-inset-top)
        );
}

.icon-button svg {
    width: 24px;
    height: 24px;

    fill: currentColor;
}


/* =========================================================
   TITLE SCREEN
========================================================= */

#titleScreen {
    justify-content: center;
    align-items: center;

    color: white;
}

#titleBackground {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;
}

.title-overlay {
    position: absolute;
    inset: 0;

    background:
        rgba(0,0,0,.58);
}

.title-content {
    position: relative;
    z-index: 20;

    width: min(90%, 900px);

    padding: 20px;

    text-align: center;
}

.title-content h1 {
    color: white;

    font-size:
        clamp(34px, 10vw, 70px);

    line-height: 1.28;

    text-shadow:
        0 5px 25px black;
}


/* =========================================================
   CONTENT SCREEN
========================================================= */

#contentScreen {
    color: white;
}

#contentBackground {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    background-size: cover;
    background-position: center;
}

.content-overlay {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.80),
            rgba(0,0,0,.35)
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.88),
            transparent 70%
        );
}

.content-scroll {
    position: relative;
    z-index: 20;

    width: min(100%, 950px);
    height: 100%;

    margin: auto;

    overflow-y: auto;

    padding:
        calc(
            88px +
            env(safe-area-inset-top)
        )
        25px
        125px;
}

.content-scroll h1 {
    margin-bottom: 24px;

    color: var(--gold-light);

    font-size:
        clamp(28px, 8vw, 58px);

    line-height: 1.3;
}

#contentDescription {
    font-size:
        clamp(19px, 5vw, 30px);

    line-height: 1.75;

    text-align: justify;

    white-space: pre-wrap;

    text-shadow:
        0 2px 10px black;
}

#contentDescription.no-caption {
    display: none;
}


/* =========================================================
   BOTTOM CONTROLS
========================================================= */

.bottom-controls {
    position: absolute;

    z-index: 200;

    left: 50%;

    bottom:
        max(
            22px,
            env(safe-area-inset-bottom)
        );

    transform:
        translateX(-50%);

    display: flex;

    gap: 12px;
}

.control-button {
    min-height: 46px;

    padding: 0 17px;

    border:
        1px solid
        rgba(255,255,255,.35);

    border-radius: 50px;

    background:
        rgba(0,0,0,.65);

    color: white;

    font-weight: 700;

    cursor: pointer;

    backdrop-filter:
        blur(12px);
}

.control-button.active {
    background: var(--gold);

    color: #1e1304;

    border-color:
        var(--gold);
}


/* =========================================================
   NUMBER SCREEN
========================================================= */

#numberScreen {
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at top,
            #195c9d,
            #061326 68%
        );

    color: white;
}

.number-wrap {
    width: min(92%, 510px);

    padding-bottom: 80px;

    text-align: center;
}

.number-wrap h1 {
    color: var(--gold-light);

    font-size:
        clamp(29px, 9vw, 50px);
}

.number-wrap p {
    margin: 15px 0 25px;

    line-height: 1.6;

    opacity: .85;
}

#locationInput {
    width: 100%;
    height: 75px;

    border:
        1px solid
        var(--gold);

    border-radius: 16px;

    background:
        rgba(255,255,255,.09);

    color: white;

    text-align: center;

    font-size: 33px;

    letter-spacing: 8px;

    outline: none;
}

.keypad {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 11px;

    margin-top: 20px;
}

.key {
    min-height: 62px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 13px;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 23px;

    cursor: pointer;
}

.key.enter {
    grid-column: span 2;

    background:
        var(--gold);

    color: #1e1304;

    font-size: 15px;

    font-weight: 800;
}


/* =========================================================
   MENU
========================================================= */

#menuOverlay {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: none;

    background:
        rgba(0,0,0,.76);

    backdrop-filter:
        blur(16px);
}

#menuOverlay.open {
    display: block;
}

.menu-panel {
    position: relative;

    width: min(88%, 440px);
    height: 100%;

    padding:
        calc(
            88px +
            env(safe-area-inset-top)
        )
        20px
        40px;

    overflow-y: auto;

    background:
        linear-gradient(
            180deg,
            #0d3d73,
            #04162f
        );

    color: white;
}

.menu-title {
    margin-bottom: 26px;

    color: var(--gold-light);

    font-size: 30px;
}

.menu-item {
    width: 100%;

    min-height: 62px;

    margin-bottom: 12px;

    padding: 16px 18px;

    text-align: left;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 14px;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 16px;

    cursor: pointer;
}


/* =========================================================
   LIST SCREENS
========================================================= */

.list-screen {
    background:
        linear-gradient(
            180deg,
            #0d3d73,
            #04162f
        );

    color: white;

    overflow-y: auto;
}

.list-container {
    width: min(94%, 850px);

    margin: auto;

    padding:
        95px 0
        40px;
}

.list-container h1 {
    margin-bottom: 24px;

    color: var(--gold-light);

    font-size:
        clamp(30px, 8vw, 50px);
}

.list-card {
    display: grid;

    grid-template-columns:
        105px
        1fr
        30px;

    align-items: center;

    gap: 14px;

    margin-bottom: 14px;

    padding: 10px;

    border:
        1px solid
        rgba(255,255,255,.14);

    border-radius: 17px;

    background:
        rgba(255,255,255,.07);

    cursor: pointer;
}

.list-card img {
    width: 105px;
    height: 84px;

    object-fit: cover;

    border-radius: 12px;
}

.list-card-title {
    font-size:
        clamp(17px, 5vw, 25px);
}

.list-arrow {
    color: var(--gold-light);

    font-size: 30px;
}


/* =========================================================
   MUSIC MODAL
========================================================= */

#musicModal {
    position: fixed;
    inset: 0;

    z-index: 2000;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        rgba(0,0,0,.82);

    backdrop-filter:
        blur(14px);
}

#musicModal.open {
    display: flex;
}

.music-box {
    position: relative;

    width: min(100%, 600px);

    max-height: 88dvh;

    overflow-y: auto;

    padding: 25px;

    border:
        1px solid
        rgba(216,177,90,.55);

    border-radius: 22px;

    background:
        linear-gradient(
            150deg,
            #11447e,
            #06162b
        );

    color: white;
}

.music-box h2 {
    margin-bottom: 22px;

    color: var(--gold-light);
}

.music-item {
    margin-bottom: 10px;

    padding: 16px;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius: 12px;

    background:
        rgba(255,255,255,.07);

    cursor: pointer;
}

.music-item.playing {
    border-color:
        var(--gold);

    background:
        rgba(216,177,90,.15);
}

#lyrics {
    margin-top: 22px;

    white-space: pre-wrap;

    font-size: 18px;

    line-height: 1.8;
}


/* =========================================================
   EXIT DIALOG
========================================================= */

#exitDialog {
    position: fixed;
    inset: 0;

    z-index: 3000;

    display: none;

    justify-content: center;
    align-items: center;

    padding: 20px;

    background:
        rgba(0,0,0,.84);
}

#exitDialog.open {
    display: flex;
}

.exit-box {
    width: min(100%, 420px);

    padding: 28px;

    border:
        1px solid
        var(--gold);

    border-radius: 22px;

    background:
        #09284c;

    color: white;

    text-align: center;
}

.exit-box h2 {
    color: var(--gold-light);

    margin-bottom: 12px;
}

#exitPassword {
    width: 100%;
    height: 58px;

    margin: 20px 0;

    border:
        1px solid
        var(--gold);

    border-radius: 12px;

    background:
        rgba(255,255,255,.08);

    color: white;

    text-align: center;

    font-size: 22px;

    outline: none;
}

.dialog-buttons {
    display: flex;

    gap: 12px;
}

.dialog-buttons button {
    flex: 1;
}


/* =========================================================
   EXIT SCREEN
========================================================= */

#exitScreen {
    justify-content: center;
    align-items: center;

    background:
        var(--deep-blue);

    color: white;

    text-align: center;
}

.exit-screen-content {
    padding: 30px;
}

.exit-screen-content h1 {
    color: var(--gold-light);

    margin-bottom: 15px;
}


/* =========================================================
   TOAST
========================================================= */

#toast {
    position: fixed;

    z-index: 5000;

    left: 50%;

    bottom: 90px;

    transform:
        translateX(-50%)
        translateY(20px);

    max-width: 85%;

    padding: 13px 22px;

    border-radius: 50px;

    background:
        rgba(0,0,0,.86);

    color: white;

    text-align: center;

    opacity: 0;

    transition: .25s;

    pointer-events: none;
}

#toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 430px) {

    .welcome-content {
        padding-bottom:
            calc(
                110px +
                env(safe-area-inset-bottom)
            );
    }

    .language-button {
        min-height: 78px;
    }

    .list-card {
        grid-template-columns:
            90px
            1fr
            25px;
    }

    .list-card img {
        width: 90px;
        height: 74px;
    }
}

</style>
</head>

<body>

<div id="app">


<!-- =========================================================
     LOADING
========================================================= -->

<section
    id="loaderScreen"
    class="screen active"
>
    <div class="loader"></div>
</section>


<!-- =========================================================
     WELCOME
========================================================= -->

<section
    id="welcomeScreen"
    class="screen"
>

    <div class="media-background">

        <video
            id="welcomeVideo"
            autoplay
            muted
            loop
            playsinline
        ></video>

        <div class="dark-overlay"></div>

    </div>

    <div class="welcome-content">

        <div
            class="temple-tamil"
            id="welcomeTamil"
        ></div>

        <div
            class="temple-english"
            id="welcomeEnglish"
        ></div>

        <div
            class="temple-code"
            id="templeCode"
        ></div>

        <br>

        <button
            class="primary-button"
            onclick="startApplication()"
            id="startButton"
        >
            START EXPLORING
        </button>

    </div>

    <div class="app-footer">

        <div class="powered-by-text">
            Powered by
            <strong>
                SRM Group of Institutions Tiruchirappalli
            </strong>
        </div>

        <img
            class="footer-logo"
            id="welcomeLogo"
            alt="SRM Group of Institutions"
        >

    </div>

</section>


<!-- =========================================================
     LANGUAGE
========================================================= -->

<section
    id="languageScreen"
    class="screen"
>

    <div class="language-wrap">

        <h1 id="languageHeading">
            Select Language
        </h1>

        <p id="languageDescription">
            Choose your preferred language
        </p>

        <div
            id="languageGrid"
            class="language-grid"
        ></div>

    </div>

</section>


<!-- =========================================================
     INTRO VIDEO
========================================================= -->

<section
    id="introScreen"
    class="screen"
>

    <video
        id="introVideo"
        playsinline
        preload="auto"
    ></video>

    <button
        class="icon-button top-right"
        onclick="toggleMute()"
        id="introSoundButton"
    ></button>

</section>


<!-- =========================================================
     TITLE SCREEN
========================================================= -->

<section
    id="titleScreen"
    class="screen"
>

    <img
        id="titleBackground"
        alt=""
    >

    <div class="title-overlay"></div>

    <button
        class="icon-button top-left"
        onclick="closeContent()"
        id="titleCloseButton"
    ></button>

    <button
        class="icon-button top-right"
        onclick="toggleMute()"
        id="titleSoundButton"
    ></button>

    <div class="title-content">
        <h1 id="titleText"></h1>
    </div>

</section>


<!-- =========================================================
     CONTENT
========================================================= -->

<section
    id="contentScreen"
    class="screen"
>

    <div
        id="contentBackground"
    ></div>

    <div
        class="content-overlay"
    ></div>

    <button
        class="icon-button top-left"
        onclick="closeContent()"
        id="contentCloseButton"
    ></button>

    <button
        class="icon-button top-right"
        onclick="openMenu()"
        id="menuButton"
    ></button>

    <div
        class="content-scroll"
    >

        <h1
            id="contentTitle"
        ></h1>

        <div
            id="contentDescription"
            class="no-caption"
        ></div>

    </div>

    <div
        class="bottom-controls"
    >

        <button
            id="soundButton"
            class="control-button"
            onclick="toggleMute()"
        >
            SOUND
        </button>

        <button
            id="ccButton"
            class="control-button"
            onclick="toggleCC()"
        >
            CC
        </button>

        <button
            id="musicButton"
            class="control-button hidden"
            onclick="openRecommendedMusic()"
        >
            MUSIC
        </button>

    </div>

</section>


<!-- =========================================================
     NUMBER SCREEN
========================================================= -->

<section
    id="numberScreen"
    class="screen"
>

    <button
        class="icon-button top-right"
        onclick="openMenu()"
        id="numberMenuButton"
    ></button>

    <div
        class="number-wrap"
    >

        <h1
            id="numberHeading"
        ></h1>

        <p
            id="numberText"
        ></p>

        <input
            id="locationInput"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="5"
            autocomplete="off"
        >

/* =========================================================

========================================================= */

function langText(object) {

    if (!object) return "";

    return (
        object[STATE.language] ||
        object.en ||
        object.ta ||
        ""
    );

}

function langAudio(object) {

    if (!object) return "";

    return (
        object[STATE.language] ||
        object.en ||
        object.ta ||
        ""
    );

}

function t(key) {

    return langText(UI[key]);

}

function stopAudio(audio) {

    audio.pause();

    try {
        audio.currentTime = 0;
    } catch(error) {}

}

function stopAllAudio() {

    stopAudio(narrationAudio);

    stopAudio(titleAudio);

    stopAudio(musicAudio);

}

function showScreen(id) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });

    const screen =
        document.getElementById(id);

    if (screen) {

        screen.classList.add("active");

    }

}


/* =========================================================
   FULLSCREEN CONTROL
========================================================= */

async function requestAppFullscreen() {

    try {

        if (
            !document.fullscreenElement &&
            document.documentElement.requestFullscreen
        ) {

            await document
                .documentElement
                .requestFullscreen({
                    navigationUI: "hide"
                });

        }

    } catch(error) {

        /* Browser may refuse fullscreen.
           Application continues normally. */

    }

}


/* =========================================================
   START APPLICATION
========================================================= */

async function startApplication() {

    STATE.applicationStarted = true;

    /*
       This must happen from a user click.
       Browsers do not allow automatic fullscreen
       without user interaction.
    */

    await requestAppFullscreen();

    showScreen(
        "languageScreen"
    );

}

/* =========================================================
   KEYPAD
========================================================= */

function renderKeypad() {

    const keypad =
        document.getElementById(
            "keypad"
        );

    keypad.innerHTML = "";

    const values = [

        "1", "2", "3",
        "4", "5", "6",
        "7", "8", "9",

        "CLEAR",
        "0",
        "BACK",

        "ENTER"

    ];

    values.forEach(value => {

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "key";

        if (
            value === "ENTER"
        ) {

            button.classList.add(
                "enter"
            );

            button.textContent =
                t("enter");

        } else if (
            value === "CLEAR"
        ) {

            button.textContent =
                t("clear");

        } else if (
            value === "BACK"
        ) {

            button.textContent =
                t("back");

        } else {

            button.textContent =
                value;

        }

        button.onclick =
            () => handleKey(value);

        keypad.appendChild(
            button
        );

    });

}

function handleKey(value) {

    const input =
        document.getElementById(
            "locationInput"
        );

    if (
        /^[0-9]$/.test(value)
    ) {

        input.value += value;

        return;

    }

    if (
        value === "CLEAR"
    ) {

        input.value = "";

        return;

    }

    if (
        value === "BACK"
    ) {

        input.value =
            input.value.slice(
                0,
                -1
            );

        return;

    }

    if (
        value === "ENTER"
    ) {

        findLocation();

    }

}

function findLocation() {

    const number =
        document
            .getElementById(
                "locationInput"
            )
            .value
            .trim();

    const location =
        LOCATIONS.find(item =>
            item.number === number
        );

    if (!location) {

        showToast(
            "Location not found"
        );

        return;

    }

    openContent(
        location,
        "numberScreen"
    );

}


/* =========================================================
   CONTENT
========================================================= */

function openContent(
    content,
    previousScreen
) {

    STATE.currentContent =
        content;

    STATE.previousScreen =
        previousScreen;

    stopAllAudio();

    clearCaption();

    showTitle(content);

}

function showTitle(content) {

    showScreen(
        "titleScreen"
    );

    document
        .getElementById(
            "titleText"
        )
        .textContent =
        langText(
            content.title
        );

    document
        .getElementById(
            "titleBackground"
        )
        .src =
        CONFIG.titleBackground;

    const audio =
        langAudio(
            content.audio
        );

    if (!audio) {

        setTimeout(
            () =>
                showContent(content),
            1500
        );

        return;

    }

    titleAudio.src =
        audio;

    titleAudio.muted =
        STATE.muted;

    titleAudio.onended =
        () =>
            showContent(content);

    titleAudio.onerror =
        () =>
            showContent(content);

    titleAudio.play()
        .catch(() => {

            setTimeout(
                () =>
                    showContent(content),
                1500
            );

        });

}

function showContent(content) {

    stopAudio(
        titleAudio
    );

    showScreen(
        "contentScreen"
    );

    document
        .getElementById(
            "contentTitle"
        )
        .textContent =
        langText(
            content.title
        );

    const background =
        document.getElementById(
            "contentBackground"
        );

    background.style.backgroundImage =
        `url("${content.image}")`;

    if (
        content.music &&
        content.music.length
    ) {

        document
            .getElementById(
                "musicButton"
            )
            .classList.remove(
                "hidden"
            );

    } else {

        document
            .getElementById(
                "musicButton"
            )
            .classList.add(
                "hidden"
            );

    }

    if (
        STATE.ccEnabled
    ) {

        startCaption(
            langText(
                content.description
            ),
            content
        );

    } else {

        document
            .getElementById(
                "contentDescription"
            )
            .classList.add(
                "no-caption"
            );

        playNarration(content);

    }

}


/* =========================================================
   NARRATION
========================================================= */

function playNarration(content) {

    stopAudio(
        narrationAudio
    );

    const source =
        langAudio(
            content.audio
        );

    if (!source) {

        return;

    }

    narrationAudio.src =
        source;

    narrationAudio.muted =
        STATE.muted;

    narrationAudio.play()
        .catch(() => {});

}


/* =========================================================
   CC TYPING
========================================================= */

function toggleCC() {

    STATE.ccEnabled =
        !STATE.ccEnabled;

    updateControlButtons();

    if (
        !STATE.currentContent
    ) {

        return;

    }

    if (
        !document
            .getElementById(
                "contentScreen"
            )
            .classList
            .contains("active")
    ) {

        return;

    }

    if (
        STATE.ccEnabled
    ) {

        startCaption(
            langText(
                STATE.currentContent
                    .description
            ),
            STATE.currentContent
        );

    } else {

        clearCaption();

        document
            .getElementById(
                "contentDescription"
            )
            .classList.add(
                "no-caption"
            );

        playNarration(
            STATE.currentContent
        );

    }

}

function clearCaption() {

    if (
        STATE.captionTimer
    ) {

        clearInterval(
            STATE.captionTimer
        );

    }

    STATE.captionTimer =
        null;

}

function startCaption(
    text,
    content
) {

    clearCaption();

    stopAudio(
        narrationAudio
    );

    const output =
        document.getElementById(
            "contentDescription"
        );

    output.classList.remove(
        "no-caption"
    );

    output.textContent = "";

    const characters =
        Array.from(
            text || ""
        );

    let index = 0;

    STATE.captionTimer =
        setInterval(() => {

            if (
                index >=
                characters.length
            ) {

                clearCaption();

                return;

            }

            output.textContent +=
                characters[index];

            index++;

        }, 18);

    playNarration(content);

}


/* =========================================================
   CLOSE CONTENT
========================================================= */

function closeContent() {

    stopAllAudio();

    clearCaption();

    if (
        STATE.previousScreen ===
        "festivalScreen"
    ) {

        showScreen(
            "festivalScreen"
        );

        return;

    }

    if (
        STATE.previousScreen ===
        "sevaScreen"
    ) {

        showScreen(
            "sevaScreen"
        );

        return;

    }

    goToNumberScreen();

}


/* =========================================================
   MENU
========================================================= */

function openMenu() {

    document
        .getElementById(
            "menuOverlay"
        )
        .classList.add(
            "open"
        );

}

function closeMenu() {

    document
        .getElementById(
            "menuOverlay"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   FESTIVALS
========================================================= */

function showFestivalList() {

    closeMenu();

    renderList(
        FESTIVALS,
        "festivalList",
        "festivalScreen"
    );

    showScreen(
        "festivalScreen"
    );

}


/* =========================================================
   SEVAS
========================================================= */

function showSevaList() {

    closeMenu();

    renderList(
        SEVAS,
        "sevaList",
        "sevaScreen"
    );

    showScreen(
        "sevaScreen"
    );

}


/* =========================================================
   LIST RENDERER
========================================================= */

function renderList(
    items,
    containerId,
    source
) {

    const container =
        document.getElementById(
            containerId
        );

    container.innerHTML = "";

    items.forEach(item => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "list-card";

        card.innerHTML = `

            <img
                src="${item.image}"
                alt=""
            >

            <div
                class="list-card-title"
            >
                ${langText(item.title)}
            </div>

            <div
                class="list-arrow"
            >
                ›
            </div>

        `;

        card.onclick =
            () =>
                openContent(
                    item,
                    source
                );

        container.appendChild(
            card
        );

    });

}

function returnFromList() {

    goToNumberScreen();

}


/* =========================================================
   MUSIC
========================================================= */

function openMusicGallery() {

    closeMenu();

    openMusic(
        MUSIC
    );

}

function openRecommendedMusic() {

    const ids =
        STATE.currentContent
            ?.music || [];

    const filtered =
        MUSIC.filter(item =>
            ids.includes(
                item.id
            )
        );

    openMusic(
        filtered
    );

}

function openMusic(songs) {

    const modal =
        document.getElementById(
            "musicModal"
        );

    modal.classList.add(
        "open"
    );

    renderMusic(songs);

}

function renderMusic(songs) {

    const list =
        document.getElementById(
            "musicList"
        );

    list.innerHTML = "";

    songs.forEach(song => {

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "music-item";

        item.textContent =
            langText(
                song.title
            );

        item.onclick =
            () =>
                playMusic(song);

        list.appendChild(
            item
        );

    });

}

function playMusic(song) {

    STATE.currentMusic =
        song;

    stopAudio(
        musicAudio
    );

    musicAudio.src =
        song.audio;

    musicAudio.muted =
        STATE.muted;

    musicAudio.play()
        .catch(() => {});

    document
        .getElementById(
            "lyrics"
        )
        .textContent =
        langText(
            song.lyrics
        );

}

function toggleMusic() {

    if (
        !musicAudio.src
    ) return;

    if (
        musicAudio.paused
    ) {

        musicAudio.play()
            .catch(() => {});

    } else {

        musicAudio.pause();

    }

}

function stopMusic() {

    stopAudio(
        musicAudio
    );

}

function closeMusic() {

    stopMusic();

    document
        .getElementById(
            "musicModal"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   EXIT
========================================================= */

function openExitDialog() {

    closeMenu();

    document
        .getElementById(
            "exitDialog"
        )
        .classList.add(
            "open"
        );

    document
        .getElementById(
            "exitPassword"
        )
        .value = "";

}

function closeExitDialog() {

    document
        .getElementById(
            "exitDialog"
        )
        .classList.remove(
            "open"
        );

}

function verifyExit() {

    const password =
        document
            .getElementById(
                "exitPassword"
            )
            .value;

    if (
        password !==
        CONFIG.exitPassword
    ) {

        showToast(
            "Incorrect Password"
        );

        return;

    }

    STATE.exitApproved =
        true;

    stopAllAudio();

    clearCaption();

    closeExitDialog();

    /*
       RELEASE FULLSCREEN ONLY
       AFTER CORRECT PASSWORD
    */

    if (
        document.fullscreenElement &&
        document.exitFullscreen
    ) {

        document
            .exitFullscreen()
            .catch(() => {});

    }

    showScreen(
        "exitScreen"
    );

}

function goHome() {

    STATE.exitApproved =
        false;

    showScreen(
        "welcomeScreen"
    );

}


/* =========================================================
   BROWSER BACK CONTROL
========================================================= */

history.pushState(
    null,
    "",
    location.href
);

window.addEventListener(
    "popstate",
    function() {

        /*
           If application has not been
           officially exited, prevent
           normal back navigation.
        */

        if (
            !STATE.exitApproved
        ) {

            history.pushState(
                null,
                "",
                location.href
            );

            return;

        }

    }
);


/* =========================================================
   DISABLE COMMON GESTURES
========================================================= */

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    }
);

document.addEventListener(
    "gesturestart",
    event => {

        event.preventDefault();

    }
);

document.addEventListener(
    "touchmove",
    event => {

        /*
           Prevent browser page pull gestures.
           Internal content elements still scroll
           through their own overflow.
        */

        if (
            !event.target.closest(
                ".content-scroll, .list-screen, .language-wrap, .menu-panel, .music-box"
            )
        ) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "show"
            );

        }, 2500);

}


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    document
        .getElementById(
            "welcomeTamil"
        )
        .textContent =
        CONFIG.templeTamil;

    document
        .getElementById(
            "welcomeEnglish"
        )
        .textContent =
        CONFIG.templeEnglish;

    document
        .getElementById(
            "templeCode"
        )
        .textContent =
        CONFIG.templeCode;

    document
        .getElementById(
            "welcomeLogo"
        )
        .src =
        CONFIG.srmLogo;

    document
        .getElementById(
            "numberLogo"
        )
        .src =
        CONFIG.srmLogo;

    updateIcons();

    renderLanguages();

    updateLanguageUI();

    loadWelcomeVideo();

    setTimeout(() => {

        showScreen(
            "welcomeScreen"
        );

    }, 1000);

}

initialize();

</script>
